<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tybee House — Upstairs Photo Map</title>
  <style>
    body {
      margin: 0;
      background: #FAFAFA;
      font-family: 'Inter', -apple-system, Helvetica, Arial, sans-serif;
    }

    /* Wrapper matches the floorplan image; markers are positioned
       as percentages of it, so everything scales together.
       Width is capped so the full plan fits the visible window:
       no wider than the viewport, no taller than its height
       (image aspect ratio 3176/2680), no larger than native size. */
    .plan-wrap {
      position: relative;
      width: min(100vw, calc(100vh * (3176 / 2680)), 3176px);
      width: min(100vw, calc(100dvh * (3176 / 2680)), 3176px);
      margin: 0 auto;
      container-type: inline-size;
      font-size: 24px;     /* fallback if container units unsupported */
    }
    @supports (font-size: 1cqw) {
      .plan-wrap { font-size: 2cqw; }  /* ~ same size as the plan's room labels */
    }
    .plan-wrap > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Red photo-number markers */
    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.15em;
      color: #C61E1E;
      font-weight: 700;
      font-size: 1em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff;
    }
    .marker:hover { color: #E03030; }
    .marker:hover .num { text-decoration: underline; }
    .marker .arrow {
      width: 1.1em;
      height: 1.1em;
      flex: none;
    }
    .marker .arrow path {
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }

    /* Forest green button over the stairs, linking to the other floor */
    .stair-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2em;
      height: 2.2em;
      background: #228B22;
      color: #fff;
      border-radius: 0.5em;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }
    .stair-btn:hover { background: #2FA82F; }
    .stair-btn svg { width: 70%; height: 70%; }
    .stair-btn path {
      stroke: currentColor;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Full-window photo viewer */
    .lightbox {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.93);
      cursor: zoom-out;
    }
    .lightbox[hidden] { display: none; }
    .lightbox img {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;   /* fill the window, keep aspect ratio */
    }
    .lightbox .caption {
      position: absolute;
      left: 50%;
      bottom: 0.5em;
      transform: translateX(-50%);
      color: #fff;
      font-size: 16px;
      text-shadow: 0 0 4px #000;
    }

    /* Blue bedroom labels */
    .room-label {
      position: absolute;
      transform: translate(-50%, -50%);
      color: #1E3EC6;
      font-weight: 700;
      font-size: 1em;
      letter-spacing: 0.15em;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="plan-wrap" id="plan">
    <img src="images/Tybee/Tybee 073.jpg" alt="Upstairs floorplan of the Tybee house">
    <a class="stair-btn" href="downstairs.html" title="Go downstairs"
       style="left: 18.2%; top: 93.5%;" aria-label="Go downstairs">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3 L12 20 M12 20 L5 13 M12 20 L19 13"></path>
      </svg>
    </a>
  </div>

  <script>
  (function () {
    'use strict';

    // Photo markers. n = photo number (links to images/Tybee/Tybee NNN.jpg),
    // x / y = percent position on the floorplan image,
    // a = arrow direction in degrees (0 = up/north, 90 = right/east, clockwise).
    // Omit `a` for a number with no direction arrow.
    var MARKERS = [
      { n: 62, x:  4.5, y:  4.0, a: 180 },
      { n:  4, x: 12.4, y:  4.0, a: 225 },
      { n: 16, x: 18.5, y:  5.3, a: 100 },
      { n: 17, x: 42.0, y:  3.6, a: 180 },
      { n: 19, x: 47.0, y:  4.4, a: 225 },
      { n: 21, x: 56.4, y:  4.0, a:  90 },
      { n: 24, x: 66.3, y:  4.0, a: 135 },
      { n: 25, x: 81.0, y:  4.4, a: 225 },
      { n: 18, x: 32.0, y: 12.1, a:  90 },
      { n: 20, x: 52.0, y: 15.7, a:  15 },
      { n: 22, x: 65.9, y: 12.1, a:  90 },
      { n: 23, x: 66.5, y: 19.6, a:  45 },
      { n: 26, x: 75.7, y: 25.0, a: 180 },
      { n: 48, x: 59.0, y: 24.0 },
      { n: 45, x: 44.5, y: 25.8 },
      { n: 46, x: 36.0, y: 28.0, a:  90 },
      { n: 47, x: 44.8, y: 31.4, a:   0 },
      { n: 44, x: 50.0, y: 30.8, a:  30 },
      { n: 27, x: 71.0, y: 33.8, a:  90 },
      { n: 42, x: 36.3, y: 41.5, a:  45 },
      { n: 43, x: 44.0, y: 41.5, a:   0 },
      { n: 41, x: 52.0, y: 41.5, a: 315 },
      { n: 12, x: 24.0, y: 46.2, a:   0 },
      { n: 13, x: 28.8, y: 51.0, a:  45 },
      { n: 33, x: 36.8, y: 48.0, a: 135 },
      { n:  0, x: 44.5, y: 47.1, a: 135 },
      { n: 28, x: 71.0, y: 50.4, a: 135 },
      { n: 34, x: 50.0, y: 56.3, a:   0 },
      { n: 15, x: 28.5, y: 68.7, a: 190 },
      { n:  3, x: 67.8, y: 69.9, a:  45 },
      { n: 32, x: 83.0, y: 69.3, a:   0 },
      { n: 11, x: 24.8, y: 78.8, a: 150 },
      { n: 37, x: 53.6, y: 77.5, a: 225 },
      { n: 38, x: 48.0, y: 80.0, a:   0 },
      { n: 29, x: 78.5, y: 78.2, a: 170 },
      { n: 30, x: 73.8, y: 81.8, a: 135 },
      { n: 36, x: 53.5, y: 85.9, a: 270, pre: true },
      { n: 40, x: 60.5, y: 88.3 },
      { n: 35, x: 50.8, y: 93.2, a: 315 },
      { n: 39, x: 60.5, y: 94.8 },
      { n: 31, x: 73.3, y: 94.2, a:  45 }
    ];

    // Blue bedroom labels.
    var LABELS = [
      { text: 'BQ',   x: 41.5, y: 14.8 },
      { text: 'BK',   x: 77.3, y: 14.8 },
      { text: 'FK',   x: 44.0, y: 38.5 },
      { text: 'FT',   x: 79.5, y: 38.5 },
      { text: 'MONK', x: 43.0, y: 90.0 }
    ];

    var ARROW_SVG =
      '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(DEGdeg)">' +
      '<path d="M12 21 L12 4 M12 4 L6.5 10.5 M12 4 L17.5 10.5"></path></svg>';

    function pad3(n) {
      var s = String(n);
      while (s.length < 3) { s = '0' + s; }
      return s;
    }

    var plan = document.getElementById('plan');
    var i, m, el, html;

    // Full-window photo viewer: clicking a number shows its photo scaled
    // to fill the visible window instead of loading the raw jpg file.
    var lightbox = document.createElement('div');
    lightbox.className = 'lightbox';
    lightbox.hidden = true;
    lightbox.innerHTML = '<img alt=""><span class="caption"></span>';
    document.body.appendChild(lightbox);
    var lightboxImg = lightbox.getElementsByTagName('img')[0];
    var lightboxCaption = lightbox.getElementsByTagName('span')[0];

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImg.removeAttribute('src');
    }
    lightbox.onclick = closeLightbox;
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 27) { closeLightbox(); }
    });

    function markerClick(e) {
      // Let modified clicks (new tab, etc.) reach the raw file as usual.
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) { return; }
      e.preventDefault();
      lightboxImg.src = this.href;
      lightboxImg.alt = this.title;
      lightboxCaption.textContent = this.title;
      lightbox.hidden = false;
    }

    for (i = 0; i < MARKERS.length; i++) {
      m = MARKERS[i];
      el = document.createElement('a');
      el.className = 'marker';
      el.href = 'images/Tybee/Tybee ' + pad3(m.n) + '.jpg';
      el.title = 'Photo ' + pad3(m.n);
      el.style.left = m.x + '%';
      el.style.top = m.y + '%';
      el.onclick = markerClick;
      html = '<span class="num">' + m.n + '</span>';
      if (typeof m.a === 'number') {
        // m.pre puts the arrow before the number (e.g. an arrow pointing
        // left at a wall to the number's left).
        if (m.pre) {
          html = ARROW_SVG.replace('DEG', m.a) + html;
        } else {
          html += ARROW_SVG.replace('DEG', m.a);
        }
      }
      el.innerHTML = html;
      plan.appendChild(el);
    }

    for (i = 0; i < LABELS.length; i++) {
      m = LABELS[i];
      el = document.createElement('span');
      el.className = 'room-label';
      el.textContent = m.text;
      el.style.left = m.x + '%';
      el.style.top = m.y + '%';
      plan.appendChild(el);
    }
  })();
  </script>
</body>
</html>
